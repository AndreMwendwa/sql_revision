    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-hints.html
- id: SPARK-046
  difficulty: advanced
  topic: Partition pruning
  type: multiple_choice
  question: A Parquet table is partitioned by event_date. What is a common benefit of WHERE event_date = DATE
    '2026-01-01'?
  options:
    A: Spark can avoid scanning unrelated date partitions.
    B: It guarantees the entire job uses one executor.
    C: It ensures no shuffle will occur anywhere in the plan.
    D: It automatically creates a primary-key index.
  answer: A
  explanation: Filtering directly on the partition column can allow partition pruning so irrelevant partition
    directories/files need not be scanned.
  documentation:
  - title: CREATE TABLE using a data source
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-ddl-create-table-datasource.html
  - title: Spark SQL performance tuning
    url: https://spark.apache.org/docs/latest/sql-performance-tuning
- id: SPARK-047
  difficulty: advanced
  topic: Spark optimization
  type: multiple_select
  question: Which statements reflect appropriate Spark SQL performance-tuning practices? Select all that apply.
  options:
    A: Inspect EXPLAIN plans for unexpected exchanges and expensive joins.
    B: Always force BROADCAST on the largest relation in every join.
    C: Push selective filters down and project only needed columns where possible.
    D: Consider whether a genuinely small join side is suitable for broadcast.
  answer:
  - A
  - C
  - D
  explanation: Review plans, reduce unnecessary scanning/columns, and use appropriately sized broadcast-side
    tables where relevant. Blindly broadcasting an enormous table risks memory pressure and is not a general
    optimization.
  documentation:
  - title: Spark SQL performance tuning
    url: https://spark.apache.org/docs/latest/sql-performance-tuning
  - title: EXPLAIN query plans
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-explain.html
- id: SPARK-048
  difficulty: advanced
