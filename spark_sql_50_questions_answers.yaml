    url: https://spark.apache.org/docs/latest/sql-performance-tuning
  - title: Join and partitioning hints
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-hints.html
- id: SPARK-050
  difficulty: advanced
  topic: Query writing
  type: query_writing
  question: Write Spark SQL that aggregates completed-order revenue by calendar month and reports month, monthly_revenue
    and the change from the preceding month. Include months with completed orders; do not invent missing months.
  answer: "WITH monthly AS (\n  SELECT date_trunc('month', CAST(order_date AS TIMESTAMP)) AS month,\n     \
    \    SUM(total_amount) AS monthly_revenue\n  FROM orders\n  WHERE status = 'completed'\n  GROUP BY date_trunc('month',\
    \ CAST(order_date AS TIMESTAMP))\n)\nSELECT month, monthly_revenue,\n       monthly_revenue - LAG(monthly_revenue)\
    \ OVER (ORDER BY month) AS revenue_change\nFROM monthly\nORDER BY month;"
  grading_notes: Accept DATE_TRUNC/TO_DATE alternatives with equivalent month grouping. LAG must be applied
    after monthly aggregation and rows globally ordered by month.
  explanation: The first step aggregates by month; LAG reads the prior observed month in the grouped result.
    The first row has a NULL change, and absent months are not generated.
  documentation:
  - title: Built-in SQL functions
    url: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
  - title: Window functions
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-window.html
  - title: Common table expressions
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-cte.html
