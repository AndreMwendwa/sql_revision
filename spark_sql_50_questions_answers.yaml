- id: SPARK-040
  difficulty: advanced
  topic: Adaptive Query Execution
  type: multiple_select
  question: Which optimizations can Adaptive Query Execution (AQE) perform in Spark SQL? Select all that apply.
  options:
    A: Coalesce shuffle partitions after examining runtime statistics.
    B: Split/skew-optimize heavily imbalanced shuffle partitions in supported joins.
    C: Convert all SQL into MySQL queries automatically.
    D: Change a planned sort-merge join into a broadcast join where appropriate.
  answer:
  - A
  - B
  - D
  explanation: AQE can coalesce post-shuffle partitions, optimize skewed joins, and select certain more suitable
    join strategies based on runtime statistics; it does not replace a SQL engine with a different database.
  documentation:
  - title: Spark SQL performance tuning
    url: https://spark.apache.org/docs/latest/sql-performance-tuning
- id: SPARK-041
  difficulty: advanced
  topic: Query plans
  type: multiple_choice
  question: Which Spark SQL command can display a formatted query execution plan without executing the full
    SELECT for its rows?
  options:
    A: EXPLAIN FORMATTED SELECT * FROM orders
    B: PROFILE DATABASE orders
    C: DESCRIBE PHYSICAL SELECT * FROM orders
    D: SHOW PLAN ONLY orders
  answer: A
  explanation: EXPLAIN FORMATTED displays physical-plan details useful for examining joins, exchanges, and
    scans.
  documentation:
  - title: EXPLAIN query plans
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-explain.html
- id: SPARK-042
  difficulty: advanced
  topic: NULL-safe equality
  type: short_answer
  question: Which Spark SQL comparison operator treats NULL <=> NULL as TRUE?
  answer: <=>
  accepted_answers:
  - <=>
  grading_notes: Enter the three characters without surrounding SQL text.
  explanation: The null-safe equal operator <=> returns TRUE when both operands are NULL, unlike the ordinary
    = operator. It is useful for null-aware equality joins and predicates.
  documentation:
  - title: NULL semantics
    url: https://spark.apache.org/docs/latest/sql-ref-null-semantics.html
- id: SPARK-043
  difficulty: advanced
  topic: Caching
  type: true_false
  question: CACHE LAZY TABLE my_table postpones populating the cache until a later query uses the table.
  answer: true
  explanation: The optional LAZY keyword defers caching until first use rather than triggering immediate cache
    population.
  documentation:
