  type: code_completion
  question: 'Fill the hint to request eight shuffle partitions: SELECT ____ * FROM orders;'
  answer: /*+ REPARTITION(8) */
  explanation: The REPARTITION(8) hint requests repartitioning into eight partitions; actual runtime optimization
    may adjust physical behaviour.
  documentation:
