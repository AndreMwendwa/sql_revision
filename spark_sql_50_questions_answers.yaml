- id: SPARK-049
  difficulty: advanced
  topic: Troubleshooting
  type: ordering
  question: Put these four actions in a sensible diagnostic sequence for a slow Spark SQL join, assuming you
    can safely test changes.
  options:
    A: Identify costly exchanges, skew, or a poor join strategy in the plan.
    B: Rerun the workload and compare observed runtime and plan.
    C: Run EXPLAIN FORMATTED on the original query.
    D: Try an evidence-based change such as pruning columns or a small-side broadcast hint.
  answer:
  - C
  - A
  - D
  - B
  explanation: Start by inspecting the current execution plan, identify the likely bottleneck, test a targeted
    strategy, then rerun and compare both plan and runtime. A hint is not automatically the correct fix.
  documentation:
  - title: EXPLAIN query plans
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-explain.html
