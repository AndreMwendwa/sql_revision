    url: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-cache-cache-table.html
- id: SPARK-044
  difficulty: advanced
  topic: Query writing
  type: query_writing
  question: Write Spark SQL to return the highest-paid employee from each department, breaking salary ties
    by the smallest employee_id. Return department_id, employee_id and salary.
  answer: "WITH ranked AS (\n  SELECT department_id, employee_id, salary,\n         ROW_NUMBER() OVER (\n \
    \          PARTITION BY department_id\n           ORDER BY salary DESC NULLS LAST, employee_id ASC\n  \
    \       ) AS rn\n  FROM employees\n)\nSELECT department_id, employee_id, salary\nFROM ranked\nWHERE rn\
    \ = 1;"
  grading_notes: Accept a correct correlated max + tie-breaker or window-function solution; one employee per
    department required.
  explanation: ROW_NUMBER assigns one row per department when filtered to rn=1. Explicit NULLS LAST places
    unknown salaries after known salaries; the ID tie-breaker makes selection reproducible if employee_id is
    unique.
  documentation:
  - title: Common table expressions
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-cte.html
  - title: Window functions
    url: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-window.html
- id: SPARK-045
  difficulty: advanced
