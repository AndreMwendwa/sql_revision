  type: multiple_choice
  question: Which Spark SQL function returns NULL when an input like 'abc' cannot be parsed using a 3-digit
    numeric format?
  options:
    A: CAST('abc' AS INT)
    B: try_to_number('abc', '999')
    C: force_cast('abc' AS INT)
    D: parse_int('abc')
  answer: B
  explanation: try_to_number returns NULL for malformed strings that do not match the supplied numeric format;
    this is available in Spark 3.5 as well as later versions.
